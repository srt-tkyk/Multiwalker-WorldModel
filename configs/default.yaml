experiment:
  name: "exp_dreamer_shared"
  root_dir: "runs"
  seed: 42
  device: "auto"
  precision: "float32"

environment:
  env_name: "pettingzoo.sisl.multiwalker_v9"
  max_episode_steps: 500
  num_agents: 3
  frame_skip: 1
  normalize_obs: true
  stack_observations: 1
  add_agent_id: true
  vector_envs: 4
  init_random_steps: 2000

replay_buffer:
  capacity: 100000
  batch_size: 256
  prioritized: false

rssm:
  deter_size: 200
  stoch_size: 32
  hidden_size: 400
  categorical: false
  min_std: 0.1
  horizon: 15
  kl_balance: 0.8
  kl_scale: 1.0
  free_nats: 3.0

world_model:
  lr: 3.0e-4
  grad_clip: 100.0
  obs_encoder: [256, 256]
  obs_decoder: [256, 256]
  reward_decoder: [256, 256]
  value_head: [256, 256]
  actor_head: [256, 256]
  entropy_scale: 1.0e-3
  discount: 0.99
  lambda_return: 0.95
  imagine_horizon: 15
  actor_lr: 3.0e-4
  value_lr: 3.0e-4

optimization:
  train_steps: 1000000
  updates_per_env_step: 1.0
  eval_interval: 50000
  save_interval: 100000
  log_interval: 1000
  actor_updates: 1
  critic_updates: 1

ppo:
  total_timesteps: 1000000
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 4096
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

logging:
  enable_tensorboard: true
  csv_log_interval: 1000

video:
  fps: 30
  render_size: [256, 256]
  num_episodes: 3

plotting:
  smoothing_window: 10

latents:
  tsne_perplexity: 30
  tsne_iter: 1000
